services:
  # ----------------------------------------------------
  # Node.js + Express Backend API Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ath_crm_backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - ath_crm_network

  # ----------------------------------------------------
  # React + Nginx Alpine Frontend Service
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ath_crm_frontend
    restart: unless-stopped
    ports:
      - "7000:80"
    depends_on:
      - backend
    networks:
      - ath_crm_network

# ----------------------------------------------------
# Networks & Volumes
# ----------------------------------------------------
networks:
  ath_crm_network:
    driver: bridge

volumes:
  backend_uploads:
    driver: local
